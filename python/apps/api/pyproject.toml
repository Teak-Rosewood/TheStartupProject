[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-api-app"
version = "0.1.0"
description = "Sample API service built on the tsp.* runtime modules"
requires-python = ">=3.13"
dependencies = ["tsp-server", "tsp-db", "tsp-cache", "tsp-nosql", "tsp-auth", "tsp-audit", "tsp-compliance", "tsp-accounts", "tsp-admin", "tsp-payments", "tsp-jobs", "tsp-notify", "tsp-growth", "tsp-flags", "tsp-storage", "tsp-metering", "tsp-ai", "tsp-crawl", "boto3>=1.34"]

[project.scripts]
tsp-api = "tsp_api.main:main"

[tool.uv.sources]
tsp-server = { workspace = true }
tsp-db = { workspace = true }
tsp-cache = { workspace = true }
tsp-nosql = { workspace = true }
tsp-auth = { workspace = true }
tsp-audit = { workspace = true }
tsp-compliance = { workspace = true }
tsp-accounts = { workspace = true }
tsp-admin = { workspace = true }
tsp-payments = { workspace = true }
tsp-jobs = { workspace = true }
tsp-notify = { workspace = true }
tsp-growth = { workspace = true }
tsp-flags = { workspace = true }
tsp-storage = { workspace = true }
tsp-metering = { workspace = true }
tsp-ai = { workspace = true }
tsp-crawl = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp_api"]
