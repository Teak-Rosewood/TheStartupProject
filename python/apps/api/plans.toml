# Your plans, in code. Synced into the database on every start; plans removed from this file are
# deactivated (existing subscribers keep theirs). Amounts are in paise and include GST.
# Create the matching plan in the Razorpay dashboard (Subscriptions > Plans) and paste its id below.

[[plan]]
