[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-metering"
version = "0.1.0"
description = "Usage records and credit-based billing for metered features such as AI requests."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.143.3", "tsp-db"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
