[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-growth"
version = "0.1.0"
description = "Waitlist with double opt-in, first-party events, attribution, referral codes, business metrics."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.143.3", "httpx>=0.24", "tsp-db", "tsp-audit", "tsp-cache"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }
tsp-cache = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
