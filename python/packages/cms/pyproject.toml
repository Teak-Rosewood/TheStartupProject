[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-cms"
version = "0.1.0"
description = "Editorial backend: items with versions and language variants, review states, publish checks, scheduled publishing, disclosures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.110", "tsp-db", "tsp-audit", "tsp-jobs", "tsp-flags"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }
tsp-jobs = { workspace = true }
tsp-flags = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
