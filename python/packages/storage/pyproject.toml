[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-storage"
version = "0.1.0"
description = "Direct-to-S3 uploads with size/type limits, per-tenant prefixes and quotas."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.143.3", "aioboto3>=13", "tsp-db", "tsp-audit"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
