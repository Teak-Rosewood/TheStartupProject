[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-flags"
version = "0.1.0"
description = "Feature flags and kill switches with per-user, per-org and per-plan rules."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.143.3", "tsp-db", "tsp-audit"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
