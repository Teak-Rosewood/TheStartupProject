[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-cache"
version = "0.1.0"
description = "Valkey/Redis cache helpers: JSON get/set, @cached, rate limiter, lock."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["redis>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
