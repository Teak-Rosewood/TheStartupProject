[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-sources"
version = "0.1.0"
description = "Registry of external data sources and connectors with strategy fallback, cursors and health checks."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "sqlalchemy[asyncio]>=2",
  "fastapi>=0.110",
  "tsp-db",
  "tsp-audit",
  "tsp-cache",
  "tsp-crawl",
  "tsp-jobs",
  "tsp-metering",
]

[project.optional-dependencies]
s3 = ["aioboto3>=13"]
admin = ["sqladmin>=0.16"]

[project.scripts]
tsp-sources = "tsp.sources.cli:main"

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }
tsp-cache = { workspace = true }
tsp-crawl = { workspace = true }
tsp-jobs = { workspace = true }
tsp-metering = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
