[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-trends"
version = "0.1.0"
description = "Interest signals for a set of topics, scored daily into an editor's candidate list."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "sqlalchemy[asyncio]>=2",
  "fastapi>=0.110",
  "tsp-db",
  "tsp-audit",
  "tsp-crawl",
  "tsp-jobs",
  "tsp-sources",
]

[project.optional-dependencies]
admin = ["sqladmin>=0.16"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }
tsp-crawl = { workspace = true }
tsp-jobs = { workspace = true }
tsp-sources = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
