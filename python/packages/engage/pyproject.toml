[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-engage"
version = "0.1.0"
description = "Reader engagement: position polls before and after reading, read receipts, weekly streaks, points and badges, onboarding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.110", "tsp-db", "tsp-audit"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
