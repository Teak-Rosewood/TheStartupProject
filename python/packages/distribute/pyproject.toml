[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-distribute"
version = "0.1.0"
description = "Newsletters, share cards, structured data, sitemaps and labelled AI illustrations for published content."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["pillow>=10", "jinja2>=3", "httpx>=0.24", "fastapi>=0.143.3", "tsp-i18n", "tsp-notify", "tsp-storage"]

[project.optional-dependencies]
test = ["jsonschema>=4"]

[tool.uv.sources]
tsp-i18n = { workspace = true }
tsp-notify = { workspace = true }
tsp-storage = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
include = ["src/tsp/distribute/fonts/**", "src/tsp/distribute/templates/**"]
