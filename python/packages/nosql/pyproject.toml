[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-nosql"
version = "0.1.0"
description = "Typed single-table DynamoDB helper."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["aioboto3>=13"]

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
