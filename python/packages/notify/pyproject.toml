[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-notify"
version = "0.1.0"
description = "Email (SES), push (FCM), SMS (SNS) and in-app notifications with suppression and consent."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "sqlalchemy[asyncio]>=2.1.4",
  "fastapi>=0.110",
  "aioboto3>=13",
  "httpx>=0.24",
  "jinja2>=3",
  "PyJWT[crypto]>=2.8",
  "tsp-db",
  "tsp-audit",
  "tsp-jobs",
]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }
tsp-jobs = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
