[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-accounts"
version = "0.1.0"
description = "Users, organizations, memberships, invites and customer API keys."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.110", "pydantic[email]>=2", "tsp-db", "tsp-audit", "tsp-auth"]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }
tsp-auth = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
