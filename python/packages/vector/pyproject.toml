[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-vector"
version = "0.1.0"
description = "Vector and hybrid search with RAG building blocks: pgvector store, chunking, ingestion jobs, per-organization isolation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "tsp-ai",
  "sqlalchemy[asyncio]>=2",
  "fastapi>=0.110",
  "tsp-db",
  "tsp-audit",
  "tsp-jobs",
  "tsp-metering",
  "tsp-storage",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
parse = ["pypdf>=4", "python-docx>=1", "trafilatura>=1.12"]

[project.scripts]
tsp-vector = "tsp.vector.cli:main"

[tool.uv.sources]
tsp-ai = { workspace = true }
tsp-db = { workspace = true }
tsp-audit = { workspace = true }
tsp-jobs = { workspace = true }
tsp-metering = { workspace = true }
tsp-storage = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
