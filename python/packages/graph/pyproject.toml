[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-graph"
version = "0.1.0"
description = "Knowledge graph on Postgres: entities with multilingual aliases, claims with provenance, validity-dated links, stances and numeric time series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["sqlalchemy[asyncio]>=2", "fastapi>=0.110", "tsp-db"]

[tool.uv.sources]
tsp-db = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
