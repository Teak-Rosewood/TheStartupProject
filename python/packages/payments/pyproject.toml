[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsp-payments"
version = "0.1.0"
description = "Provider-agnostic payments (Razorpay first, Stripe second), GST invoices, credits ledger."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "sqlalchemy[asyncio]>=2",
  "fastapi>=0.143.3",
  "httpx>=0.24",
  "reportlab>=4",
  "aioboto3>=13",
  "tsp-db",
  "tsp-audit",
]

[tool.uv.sources]
tsp-db = { workspace = true }
tsp-audit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tsp"]
