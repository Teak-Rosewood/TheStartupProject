[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=5",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "hypothesis>=6.170.15",
    "fastapi>=0.162.5",
    "uvicorn>=0.29",
    "jsonschema>=4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is the formatter's job; B904 is noisy for the adapters' re-raise-as-ProviderHttpError.
ignore = ["E501", "B904", "UP042", "UP047"]  # UP042 would change str() of enums; UP047 is style only

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/ai/src:packages/infra/src:packages/cache/src:packages/db/src:packages/nosql/src:packages/auth/src:packages/server/src:packages/audit/src:packages/compliance/src:packages/accounts/src:packages/payments/src:packages/jobs/src:packages/notify/src:packages/growth/src:packages/flags/src:packages/storage/src:packages/metering/src:packages/engage/src:packages/vector/src:packages/admin/src:apps/api/src:packages/crawl/src:packages/sources/src:packages/trends/src:packages/paywall/src:packages/graph/src:packages/pipeline/src:packages/cms/src:packages/i18n/src:packages/distribute/src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "tsp.server.require_groups", "tsp.server.deps.require_groups"]

[tool.coverage.report]
# 89% on 2026-11-15; the floor stops coverage from falling quietly. Raise it as tests grow.
fail_under = 87
