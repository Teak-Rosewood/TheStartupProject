name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you expected instead }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Commit or version }
