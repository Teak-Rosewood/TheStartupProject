version: 2
# Minor and patch updates arrive as one grouped PR per ecosystem each week; majors stay separate
# so each can be judged on its own (Postgres and Python majors need a migration plan first).
updates:
  - package-ecosystem: uv
    directory: /python
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker/postgres
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /python/apps/api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker/crawl-render
    schedule: { interval: weekly }
