name: release
# A release is a tag vX.Y.Z on master (docs/adr/0002-versioning-and-releases.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/python.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: the tag matches VERSION and every manifest
        run: |
          python3 scripts/version.py check
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but VERSION is $(cat VERSION)"; exit 1; }
      - name: build every package
        working-directory: python
        run: uv build --all-packages --out-dir "$RUNNER_TEMP/dist"
      - name: release notes from CHANGELOG.md
        run: |
          python3 scripts/changelog_section.py "$(cat VERSION)" > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $(cat VERSION)"; exit 1; }
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
