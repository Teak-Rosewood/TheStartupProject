name: security
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: audit locked dependencies for known vulnerabilities
        # PYSEC-2026-3740 (nltk 3.10.3, path checks in model-artifact loaders) has no fixed release.
        # nltk arrives only through crawl4ai, the optional browser extra used by the render worker,
        # and nothing in this repository passes caller-controlled paths to nltk. Remove the ignore
        # once nltk publishes a fix (check monthly).
        run: uv export --frozen --all-extras --no-hashes --no-emit-workspace > "$RUNNER_TEMP/req.txt" && uvx pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip --ignore-vuln PYSEC-2026-3740

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3
