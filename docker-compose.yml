# Local services for integration tests: `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: test, POSTGRES_DB: test }
    ports: ["55432:5432"]
  valkey:
    image: valkey/valkey:8
    ports: ["56379:6379"]
  dynamodb:
    image: amazon/dynamodb-local
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports: ["58000:8000"]
